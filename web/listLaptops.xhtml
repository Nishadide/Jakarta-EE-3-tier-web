<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://java.sun.com/jsf/html"
      xmlns:f="http://java.sun.com/jsf/core"
      xmlns:ui="http://java.sun.com/jsf/facelets">

<!-- The Stock of Laptops. Lists every laptop; the model links to its details. -->
<ui:composition template="layout.xhtml">

<ui:define name="title">The Stock of Laptops</ui:define>
<ui:define name="heading">The Stock of Laptops</ui:define>
<ui:define name="content">

    <h:form>
        <h:dataTable value="#{productController.laptops}" var="l" border="1">
            <h:column>
                <f:facet name="header"><h:outputText value="Brand"/></f:facet>
                <h:outputText value="#{l.brand}"/>
            </h:column>
            <h:column>
                <f:facet name="header"><h:outputText value="Model"/></f:facet>
                <h:commandLink value="#{l.model}" action="#{productController.doViewProduct}">
                    <f:setPropertyActionListener target="#{productController.selectedId}" value="#{l.id}"/>
                </h:commandLink>
            </h:column>
        </h:dataTable>

        <p>Total laptops: #{productController.laptops.size()}</p>
    </h:form>

</ui:define>

<ui:define name="footer">
    <a href="newLaptop.xhtml">Create a New Laptop</a> |
    <a href="default.xhtml">Main Page</a>
</ui:define>

</ui:composition>
</html>
