<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://java.sun.com/jsf/html"
      xmlns:f="http://java.sun.com/jsf/core"
      xmlns:ui="http://java.sun.com/jsf/facelets">

<!-- List of Customers, with the number of orders and a View Details link. -->
<ui:composition template="layout.xhtml">

<ui:define name="title">List of Customers</ui:define>
<ui:define name="heading">List of Customers</ui:define>
<ui:define name="content">

    <h:form>
        <h:dataTable value="#{customerController.customers}" var="c" border="1">
            <h:column>
                <f:facet name="header"><h:outputText value="Name"/></f:facet>
                <h:outputText value="#{c.name}"/>
            </h:column>
            <h:column>
                <f:facet name="header"><h:outputText value="Address"/></f:facet>
                <h:outputText value="#{c.address}"/>
            </h:column>
            <h:column>
                <f:facet name="header"><h:outputText value="Orders"/></f:facet>
                <h:outputText value="#{c.orders.size()}"/>
            </h:column>
            <h:column>
                <f:facet name="header"><h:outputText value="Action"/></f:facet>
                <h:commandLink value="View Details" action="#{customerController.doViewDetails}">
                    <f:setPropertyActionListener target="#{customerController.selectedId}" value="#{c.id}"/>
                </h:commandLink>
            </h:column>
        </h:dataTable>

        <p>Total customers: #{customerController.customers.size()}</p>
    </h:form>

</ui:define>

<ui:define name="footer">
    <a href="newCustomer.xhtml">Create a New Customer</a> |
    <a href="default.xhtml">Main Page</a>
</ui:define>

</ui:composition>
</html>
