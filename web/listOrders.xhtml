<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://java.sun.com/jsf/html"
      xmlns:f="http://java.sun.com/jsf/core"
      xmlns:ui="http://java.sun.com/jsf/facelets">

<!-- List of Orders. The customer and device link to their details; Delete
     removes the order and restores the product stock (handled in OrderEJB). -->
<ui:composition template="layout.xhtml">

<ui:define name="title">List of Orders</ui:define>
<ui:define name="heading">List of Orders</ui:define>
<ui:define name="content">

    <h:form>
        <h:dataTable value="#{orderController.orders}" var="o" border="1">
            <h:column>
                <f:facet name="header"><h:outputText value="Order #"/></f:facet>
                <h:outputText value="#{o.id}"/>
            </h:column>
            <h:column>
                <f:facet name="header"><h:outputText value="Customer"/></f:facet>
                <h:commandLink value="#{o.customer.name}" action="#{customerController.doViewDetails}">
                    <f:setPropertyActionListener target="#{customerController.selectedId}" value="#{o.customer.id}"/>
                </h:commandLink>
            </h:column>
            <h:column>
                <f:facet name="header"><h:outputText value="Device"/></f:facet>
                <h:commandLink value="#{o.product.brand} - #{o.product.model}" action="#{productController.doViewProduct}">
                    <f:setPropertyActionListener target="#{productController.selectedId}" value="#{o.product.id}"/>
                </h:commandLink>
            </h:column>
            <h:column>
                <f:facet name="header"><h:outputText value="Action"/></f:facet>
                <h:commandLink value="Delete" action="#{orderController.doDeleteOrder}">
                    <f:setPropertyActionListener target="#{orderController.selectedId}" value="#{o.id}"/>
                </h:commandLink>
            </h:column>
        </h:dataTable>

        <p>Total orders: #{orderController.orders.size()}</p>
    </h:form>

</ui:define>

<ui:define name="footer">
    <a href="newOrder.xhtml">Create a new Order</a> |
    <a href="default.xhtml">Main Page</a>
</ui:define>

</ui:composition>
</html>
